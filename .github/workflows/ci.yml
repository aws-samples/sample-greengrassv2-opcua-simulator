name: Continuous Integration

on: [push, pull_request]

# Least-privilege: this workflow only needs to read the repository contents.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Actions are pinned to full commit SHAs to prevent supply-chain attacks
    # via mutable tags. Update the SHA and the version comment together.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Analysing the code with pylint
      run: |
        pylint libs docker tests *.py
    - name: Testing the code with pytest
      run: |
        pytest --junit-xml=junit.xml --cov=docker --cov=libs

name: Continuous Integration

on: [push, pull_request]

# Least-privilege: this workflow only needs to read the repository contents.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Actions are pinned to full commit SHAs to prevent supply-chain attacks
    # via mutable tags. Update the SHA and the version comment together.
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Set up Python 3.12
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Analysing the code with pylint
      run: |
        pylint libs docker tests *.py
    - name: Testing the code with pytest
      run: |
        pytest --junit-xml=junit.xml --cov=docker --cov=libs
